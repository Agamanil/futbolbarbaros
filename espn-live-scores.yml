name: FUTBOLBARBAROS ESPN Canli Skor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: futbolbarbaros-espn-live-scores
  cancel-in-progress: true

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Firebase Admin SDK kur
        run: npm install --no-save firebase-admin@13

      - name: ESPN skorlarini Firestore'a yaz
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/espn-live-scores.mjs
