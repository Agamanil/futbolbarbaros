
name: ESPN Fixture Reliability Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Fixture Range and Match IDs
        run: |
          echo "ESPN 7 GUNLUK FIKSTUR TESTI"

          START=$(date -u +%Y%m%d)
          END=$(date -u -d "+7 days" +%Y%m%d)

          echo "TARIH ARALIGI: $START - $END"

          competitions=(
            "tur.1|Türkiye Süper Lig"
            "eng.1|Premier League"
            "esp.1|La Liga"
            "ger.1|Bundesliga"
            "ita.1|Serie A"
            "uefa.champions|Şampiyonlar Ligi"
            "uefa.europa|Avrupa Ligi"
            "uefa.europa.conf|Konferans Ligi"
            "uefa.nations|UEFA Uluslar Ligi"
          )

          for item in "${competitions[@]}"; do
            code="${item%%|*}"
            name="${item#*|}"

            echo ""
            echo "================================"
            echo "LIG: $name"
            echo "================================"

            URL="https://site.api.espn.com/apis/site/v2/sports/soccer/$code/scoreboard?dates=$START-$END"

            curl -L -sS -o response1.json -w "ILK HTTP: %{http_code}\n" "$URL"
            curl -L -sS -o response2.json -w "IKINCI HTTP: %{http_code}\n" "$URL"

            if ! jq -e '.events | type == "array"' response1.json >/dev/null 2>&1; then
              echo "GECERSIZ ILK CEVAP"
              cat response1.json
              continue
            fi

            if ! jq -e '.events | type == "array"' response2.json >/dev/null 2>&1; then
              echo "GECERSIZ IKINCI CEVAP"
              cat response2.json
              continue
            fi

            jq -r '[.events[].id] | sort[]' response1.json > ids1.txt
            jq -r '[.events[].id] | sort[]' response2.json > ids2.txt

            echo "MAC SAYISI:"
            jq '.events | length' response1.json

            echo "MACLAR:"
            jq -r '
              .events[] |
              "\(.id) | \(.name) | \(.date) | \(.status.type.description)"
            ' response1.json

            echo "MAC ID KONTROLU:"

            if diff -u ids1.txt ids2.txt; then
              echo "BASARILI: MAC ID'LERI AYNI"
            else
              echo "UYARI: MAC ID LISTESI DEGISTI"
            fi
          done

          echo ""
          echo "TEST TAMAMLANDI"
