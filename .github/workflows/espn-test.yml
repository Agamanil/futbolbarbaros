
name: ESPN Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ESPN Liglerini Test Et
        shell: bash
        run: |
          set -e

          leagues=(
            "tur.1"
            "eng.1"
            "esp.1"
            "ger.1"
            "ita.1"
            "uefa.champions"
            "uefa.europa"
            "uefa.europa.conf"
            "uefa.nations"
          )

          for league in "${leagues[@]}"; do
            echo ""
            echo "=============================="
            echo "LIG: $league"
            echo "=============================="

            url="https://site.api.espn.com/apis/site/v2/sports/soccer/$league/scoreboard"

            curl --compressed -L -sS \
              -o response.json \
              -w "HTTP: %{http_code}\n" \
              "$url"

            if ! jq -e '.events' response.json >/dev/null; then
              echo "ESPN VERISI OKUNAMADI"
              cat response.json
              continue
            fi

            echo "MAC SAYISI:"
            jq '.events | length' response.json

            jq -r '.events[]? |
              "\(.id) | \(.name) | \(.date) | \(.status.type.description)"' response.json
          done

          echo ""
          echo "ESPN TESTI TAMAMLANDI"
