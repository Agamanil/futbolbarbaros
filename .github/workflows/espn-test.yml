
name: ESPN Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test ESPN
        run: |
          echo "ESPN baglantisi test ediliyor..."

          curl -L -sS \
            -o response.json \
            -w "HTTP STATUS: %{http_code}\n" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"

          echo "Gelen mac verileri:"

          python - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          leagues = data.get("leagues", [])
          events = data.get("events", [])

          if leagues:
              print("LIG:", leagues[0].get("name"))

          print("EVENT SAYISI:", len(events))

          for event in events:
              print(
                  event.get("name"),
                  "|",
                  event.get("date"),
                  "|",
                  event.get("status", {}).get("type", {}).get("description")
              )
          PY
