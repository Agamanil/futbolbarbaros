
name: ESPN Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test ESPN
        run: |
          echo "ESPN baglantisi test ediliyor..."
          curl -L -sS \
            -o response.json \
            -w "HTTP STATUS: %{http_code}\n" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"

          echo "Gelen veri:"
python -c "import json; d=json.load(open('response.json')); print('LIG:', d.get('leagues',[{}])[0].get('name')); print('EVENT SAYISI:', len(d.get('events',[]))); [print(x.get('name'), '|', x.get('date')) for x in d.get('events',[])]"
