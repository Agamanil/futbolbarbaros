
name: ESPN Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test ESPN
        run: |
          echo "ESPN baglantisi test ediliyor..."

          curl -L -sS \
            -o response.json \
            -w "HTTP STATUS: %{http_code}\n" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"

          echo "LIG:"
          jq -r '.leagues[0].name' response.json

          echo "EVENT SAYISI:"
          jq '.events | length' response.json

          echo "MACLAR:"
          jq -r '.events[]? | "\(.name) | \(.date) | \(.status.type.description)"' response.json
