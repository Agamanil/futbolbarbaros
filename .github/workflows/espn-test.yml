
name: ESPN Fixture Reliability Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Daily Fixtures
        run: |
          echo "ESPN GUNLUK FIKSTUR TESTI"

          START=$(date -u +%Y%m%d)

          competitions=(
            "tur.1|Türkiye Süper Lig"
            "eng.1|Premier League"
            "esp.1|La Liga"
            "ger.1|Bundesliga"
            "ita.1|Serie A"
            "uefa.champions|Şampiyonlar Ligi"
            "uefa.europa|Avrupa Ligi"
            "uefa.europa.conf|Konferans Ligi"
            "uefa.nations|UEFA Uluslar Ligi"
          )

          for item in "${competitions[@]}"; do
            code="${item%%|*}"
            name="${item#*|}"

            echo ""
            echo "################################"
            echo "LIG: $name"
            echo "################################"

            for day in {0..7}; do
              DATE=$(date -u -d "$START + $day days" +%Y%m%d)

              echo ""
              echo "TARIH: $DATE"

              status=$(curl --compressed -L -sS \
                -o response.json \
                -w "%{http_code}" \
                "https://site.api.espn.com/apis/site/v2/sports/soccer/$code/scoreboard?dates=$DATE")

              echo "HTTP: $status"

              if [ "$status" != "200" ]; then
                echo "HATA:"
                cat response.json
                continue
              fi

              echo "MAC SAYISI:"
              jq '(.events // []) | length' response.json

              jq -r '
                .events[]? |
                "\(.id) | \(.name) | \(.date) | \(.status.type.description)"
              ' response.json
            done
          done

          echo ""
          echo "TEST TAMAMLANDI"
