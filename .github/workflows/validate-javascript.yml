name: Validate JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          for source in app.js cloudflare-worker/worker.js season.js risk.js moderation.js shared-firestore-listeners.js scripts/espn-live-scores.mjs firebase-messaging-sw.js config.js; do
            cp "$source" /tmp/futbolbarbaros-check.mjs
            node --check /tmp/futbolbarbaros-check.mjs
            echo "OK: $source"
          done
