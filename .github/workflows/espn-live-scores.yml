
name: FUTBOLBARBAROS ESPN Canli Skor

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/espn-live-scores.mjs'
      - '.github/workflows/espn-live-scores.yml'
  schedule:
    - cron: '*/1 16-21 * * *'
    # Her gün 11.00 Türkiye saati: geçmiş maçlarda eksik kalan sonuçları bir kez tamamla.
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: futbolbarbaros-espn-live-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm önbelleğini yükle
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-futbolbarbaros-firebase-admin-v13
          restore-keys: |
            ${{ runner.os }}-futbolbarbaros-firebase-admin-

      - name: Firebase Admin SDK kur
        run: npm install --no-save --prefer-offline --no-audit --no-fund firebase-admin@13

      - name: ESPN skorlarini Firestore'a yaz
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HISTORICAL_BACKFILL: ${{ github.event.schedule == '0 8 * * *' && 'true' || 'false' }}
        run: node scripts/espn-live-scores.mjs
