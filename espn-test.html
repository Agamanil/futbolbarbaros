
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ESPN Bağlantı Testi</title>
</head>
<body>
  <h2>ESPN Veri Testi</h2>
  <button onclick="testESPN()">Premier League Test Et</button>
  <pre id="result">Henüz test yapılmadı.</pre>

  <script>
    async function testESPN() {
      const result = document.getElementById("result");
      result.textContent = "Bağlantı deneniyor...";

      try {
        const response = await fetch(
          "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        result.textContent = JSON.stringify(
          data.events?.map(match => ({
            mac: match.name,
            tarih: match.date,
            durum: match.status?.type?.description
          })) ?? data,
          null,
          2
        );
      } catch (error) {
        result.textContent = "TEST BAŞARISIZ: " + error.message;
      }
    }
  </script>
</body>
</html>
